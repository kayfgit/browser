[package]
name = "browser-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "A modal, mode-dispatching browser — only what's needed, when needed."

[[bin]]
name = "browser-desktop"
path = "src/main.rs"

[features]
servo-engine = ["dep:servo", "dep:content-security-policy", "dep:euclid", "dep:dpi", "dep:surfman", "dep:raw-window-handle", "dep:scoped-tls", "dep:rustls"]

[dependencies]
browser-core.workspace = true
browser-engine.workspace = true
browser-backend-text.workspace = true
browser-backend-search.workspace = true
anyhow.workspace = true
url.workspace = true
serde.workspace = true
serde_json = "1"
toml.workspace = true
directories.workspace = true
# blocking client + json for the :ai tab's Groq calls (off a background thread).
reqwest = { workspace = true, features = ["blocking", "json"] }
tao.workspace = true
wry.workspace = true
softbuffer.workspace = true
fontdue.workspace = true
# default-features off drops the image/png clipboard stack — we only do text.
arboard = { version = "3", default-features = false }
alacritty_terminal = "0.26.0"
# default-features off drops `single-thread` (which makes Engine !Send via Rc) so the
# engine is Send+Sync — we build it off-thread and share it. We only need network
# blocking, not the cosmetic/CSS machinery.
adblock = { version = "0.12.5", default-features = false, features = [
    "embedded-domain-resolver",
    "full-regex-handling",
] }
# Decodes the `data:<mime>;base64,…` bodies adblock-rust hands back for `$redirect`
# surrogate rules (`blocklist::classify_request`, kept for a future ruleset; see there).
base64 = "0.22"
png = "0.18.1"

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1.4"

# Raw WebView2 access for the native redirect guard (navguard.rs): wry's string-only
# navigation handler drops `IsUserInitiated`, which is the one signal that reliably
# separates a forced redirect from a real click. Pinned to wry 0.55's own versions so
# the COM types (ICoreWebView2*, PWSTR, BOOL) unify rather than clash.
[target.'cfg(windows)'.dependencies]
servo = { version = "=0.5.0", optional = true }
content-security-policy = { version = "=0.8.1", optional = true }
euclid = { version = "0.22", optional = true }
dpi = { version = "0.1", optional = true }
surfman = { version = "=0.13.0", optional = true }
raw-window-handle = { version = "0.6", optional = true }
scoped-tls = { version = "1", optional = true }
rustls = { version = "0.23", features = ["aws_lc_rs"], optional = true }
webview2-com = "0.38"
windows-core = "0.61"
# WebView2 COM interop (favicon.rs reads the favicon `IStream`) needs the `windows` 0.61 types webview2-com-sys is built against, NOT our 0.62 below —
# the two are distinct types. This renamed alias resolves to that same 0.61 build so the
# COM types unify.
windows061 = { package = "windows", version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
] }
windows = { version = "0.62", features = [
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
