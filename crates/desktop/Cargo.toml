[package]
name = "browser-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "A modal, mode-dispatching browser — only what's needed, when needed."

[[bin]]
name = "browser-desktop"
path = "src/main.rs"

[dependencies]
browser-core.workspace = true
browser-backend-text.workspace = true
browser-backend-search.workspace = true
anyhow.workspace = true
url.workspace = true
serde.workspace = true
serde_json = "1"
toml.workspace = true
directories.workspace = true
# blocking client + json for the :ai tab's Groq calls (off a background thread).
reqwest = { workspace = true, features = ["blocking", "json"] }
tao.workspace = true
wry.workspace = true
softbuffer.workspace = true
fontdue.workspace = true
# default-features off drops the image/png clipboard stack — we only do text.
arboard = { version = "3", default-features = false }
alacritty_terminal = "0.26.0"
# default-features off drops `single-thread` (which makes Engine !Send via Rc) so the
# engine is Send+Sync — we build it off-thread and share it. We only need network
# blocking, not the cosmetic/CSS machinery.
adblock = { version = "0.12.5", default-features = false, features = [
    "embedded-domain-resolver",
    "full-regex-handling",
] }

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1.4"

# Raw WebView2 access for the native redirect guard (navguard.rs): wry's string-only
# navigation handler drops `IsUserInitiated`, which is the one signal that reliably
# separates a forced redirect from a real click. Pinned to wry 0.55's own versions so
# the COM types (ICoreWebView2*, PWSTR, BOOL) unify rather than clash.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
