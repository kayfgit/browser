[package]
name = "browser"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
default-run = "browser"
description = "A modal, mode-dispatching browser — only what's needed, when needed."

[package.metadata.dist]
# Ship the third-party notices in the release archive (the MSI adds them too), and the
# Visual C++ runtime the binaries link (collected by .github/build-setup.yml).
include = [
    "../../THIRD_PARTY_NOTICES.md",
    "../../target/vc-runtime/msvcp140.dll",
    "../../target/vc-runtime/vcruntime140.dll",
    "../../target/vc-runtime/vcruntime140_1.dll",
]
# Releases ship both engines. Plain `cargo build` stays WebView2-only: Servo takes
# hours and many GB to compile (see run-servo.ps1 for local Servo builds).
features = ["servo-engine"]

[package.metadata.wix]
upgrade-guid = "48D6537F-B5B7-450F-BB2A-CA44F4275E40"
path-guid = "74A64A9E-90DA-43E4-9945-59106CCE9B42"
license = false
eula = false

# The browser itself. Installed as `browser.exe`.
[[bin]]
name = "browser"
path = "src/main.rs"

# Companion process that owns the ConPTY for terminal tabs (see its module docs).
# Lives in this package so every build and installer ships the pair together;
# the browser looks for it next to its own executable.
[[bin]]
name = "browser-pty-host"
path = "src/bin/browser-pty-host.rs"

[features]
servo-engine = ["dep:servo", "dep:content-security-policy", "dep:euclid", "dep:dpi", "dep:surfman", "dep:raw-window-handle", "dep:scoped-tls", "dep:rustls"]

[dependencies]
browser-core.workspace = true
browser-engine.workspace = true
browser-backend-text.workspace = true
browser-backend-search.workspace = true
anyhow.workspace = true
url.workspace = true
serde.workspace = true
serde_json = "1"
toml.workspace = true
directories.workspace = true
# blocking client + json for the :ai tab's Groq calls (off a background thread).
reqwest = { workspace = true, features = ["blocking", "json"] }
tao.workspace = true
wry.workspace = true
softbuffer.workspace = true
fontdue.workspace = true
# Fallback fonts are read one glyph at a time instead (fontdue parses every glyph of a
# face up front: Yu Gothic alone takes ~190 MB), from a memory-mapped file.
ttf-parser = "0.21"
ab_glyph_rasterizer = "0.1"
memmap2 = "0.9"
# Verifies a downloaded update against its published SHA-256 (`:update`).
sha2 = "0.10"
# default-features off drops the image/png clipboard stack — we only do text.
arboard = { version = "3", default-features = false }
alacritty_terminal = "0.26.0"
# Only used by the browser-pty-host binary.
portable-pty = "0.9"
# Renders markdown in `:ai` replies and the `:news` page (markdown.rs).
pulldown-cmark = { version = "0.13", default-features = false }
# default-features off drops `single-thread` (which makes Engine !Send via Rc) so the
# engine is Send+Sync — we build it off-thread and share it. We only need network
# blocking, not the cosmetic/CSS machinery.
adblock = { version = "0.12.5", default-features = false, features = [
    "embedded-domain-resolver",
    "full-regex-handling",
] }
# Decodes the `data:<mime>;base64,…` bodies adblock-rust hands back for `$redirect`
# surrogate rules (`blocklist::classify_request`, kept for a future ruleset; see there).
base64 = "0.22"
# Unpack the bundled extensions embedded by build.rs (bundled_extensions.rs).
flate2 = "1"
tar = "0.4"
png = "0.18.1"

[build-dependencies]
# Pack the bundled extensions into the executable (see build.rs).
flate2 = "1"
tar = "0.4"

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1.4"

# Raw WebView2 access for the native redirect guard (navguard.rs): wry's string-only
# navigation handler drops `IsUserInitiated`, which is the one signal that reliably
# separates a forced redirect from a real click. Pinned to wry 0.55's own versions so
# the COM types (ICoreWebView2*, PWSTR, BOOL) unify rather than clash.
[target.'cfg(windows)'.dependencies]
# Web features Servo's own browser enables: sites need window.crypto (webcrypto) and
# brotli-compressed fetch streams. Left out: WebGL (creating a context crashes the
# content process in multi-process mode on 0.6), WebGPU and WebXR.
servo = { version = "=0.6.0", optional = true, features = ["webcrypto", "brotli-compression-stream"] }
content-security-policy = { version = "=0.8.2", optional = true }
euclid = { version = "0.22", optional = true }
dpi = { version = "0.1", optional = true }
surfman = { version = "=0.13.0", optional = true }
raw-window-handle = { version = "0.6", optional = true }
scoped-tls = { version = "1", optional = true }
rustls = { version = "0.23", features = ["aws_lc_rs"], optional = true }
webview2-com = "0.38"
windows-core = "0.61"
# WebView2 COM interop (favicon.rs reads the favicon `IStream`) needs the `windows` 0.61 types webview2-com-sys is built against, NOT our 0.62 below —
# the two are distinct types. This renamed alias resolves to that same 0.61 build so the
# COM types unify.
windows061 = { package = "windows", version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
] }
windows = { version = "0.62", features = [
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
