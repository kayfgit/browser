[package]
name = "browser-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "A modal, mode-dispatching browser — only what's needed, when needed."

[[bin]]
name = "browser-desktop"
path = "src/main.rs"

[dependencies]
browser-core.workspace = true
browser-backend-text.workspace = true
anyhow.workspace = true
url.workspace = true
serde.workspace = true
toml.workspace = true
directories.workspace = true
tao.workspace = true
wry.workspace = true
softbuffer.workspace = true
fontdue.workspace = true
base64 = "0.22"
# default-features off drops the image/png clipboard stack — we only do text.
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
