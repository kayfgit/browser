[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist): builds the release binaries and installers.
# Regenerate .github/workflows/release.yml and crates/desktop/wix/main.wxs with
# `dist generate` after changing anything here.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["powershell", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-pc-windows-msvc"]
# Where the PowerShell installer puts the binaries (the MSI installs per user into
# the same folder's bin\, see crates/desktop/wix/main.wxs)
install-path = "$LOCALAPPDATA/Programs/browser"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# release-please creates the tag and the GitHub Release, then starts this
# workflow; dist only builds and uploads the installers to that release.
dispatch-releases = true
create-release = false
# crates/desktop/wix/main.wxs is hand-edited (Start Menu shortcut, license files),
# so `dist generate` must not overwrite it.
allow-dirty = ["msi"]
# Steps run before the build: Servo needs libclang (see .github/build-setup.yml).
github-build-setup = "../build-setup.yml"
# Link the dynamic C runtime: Servo's prebuilt SpiderMonkey uses it, and the linker
# refuses to mix it with the static one. The MSI ships the runtime DLLs it needs
# beside browser.exe (build-setup.yml collects them, wix/main.wxs installs them).
msvc-crt-static = false
