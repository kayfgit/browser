[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/engine",
    "crates/tui",
    "crates/backend-text",
    "crates/backend-search",
    "crates/cli",
    "crates/desktop",
]

[workspace.package]
version = "0.9.1"
edition = "2021"
license = "MIT"
authors = ["kayf"]
repository = "https://github.com/kayfgit/browser"
homepage = "https://github.com/kayfgit/browser"

[workspace.dependencies]
# internal crates
browser-core = { path = "crates/core" }
browser-engine = { path = "crates/engine" }
browser-tui = { path = "crates/tui" }
browser-backend-text = { path = "crates/backend-text" }
browser-backend-search = { path = "crates/backend-search" }

# shared third-party
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13", features = ["gzip", "brotli"] }
url = "2"
ratatui = "0.30"
crossterm = "0.29"
dom_smoothie = "0.17"
scraper = "0.27"
ego-tree = "0.11"
directories = "6"

# desktop GUI shell
tao = "0.35"
wry = { version = "0.55", features = ["devtools"] }
softbuffer = "0.4"
fontdue = "0.9"
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Unwind on panic: Servo runs pages on many threads and is built to lose a panicking
# one, not the whole browser. A panic can't unwind into a wry/WebView2 callback
# either way: since Rust 1.81 one crossing an `extern "C"`/`"system"` frame aborts.
panic = "unwind"

# Debug builds must stay usable: fontdue rasterization and alacritty's grid are
# hopeless at opt-level 0. Optimize the workspace a little and (once-compiled)
# dependencies harder.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Match the qualified lab's low-memory native build. Regular builds keep their profile.
[profile.servo-dev]
inherits = "dev"
opt-level = 0
debug = 0
incremental = false

[profile.servo-dev.package."*"]
opt-level = 0

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[patch.crates-io]
servo-paint-api = { path = "vendor/servo-paint-api" }
