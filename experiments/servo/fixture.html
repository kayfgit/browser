<!doctype html>
<meta charset="utf-8">
<title>Engine qualification</title>
<script>window.labScriptAtStart = window.labInjected === true;</script>
<style>
  body { font: 18px system-ui; margin: 32px; background: #edf2f3; color: #172e38; }
  input, button { font: inherit; padding: 8px; max-width: 90%; }
  .spinner { width: 48px; height: 48px; background: #26796d;
    animation: rotate 3s linear infinite; margin: 32px; }
  @keyframes rotate { to { transform: rotate(360deg); } }
  .space { height: 1200px; background: linear-gradient(#edf2f3, #a2c2b7); }
</style>
<h1 id="top">Engine qualification</h1>
<p id="injection"></p>
<p>Type here, including accented characters:</p>
<input aria-label="Typing test" placeholder="Type here">
<p id="key">Last key: none</p>
<p><button id="counter">Clicks: 0</button></p>
<p><a href="#bottom">Navigate to bottom</a></p>
<div class="spinner"></div>
<p>Scroll to the bottom; resize the window and compare both panes.</p>
<div class="space"></div>
<p id="bottom">Bottom of page. <a href="#top">Back to top</a></p>
<script>
  document.getElementById('injection').textContent =
    'Document-start script: ' + (window.labScriptAtStart ? 'PASS' : 'FAIL');
  let clicks = 0;
  document.getElementById('counter').onclick = function () {
    this.textContent = 'Clicks: ' + (++clicks);
  };
  document.addEventListener('keydown', function (event) {
    document.getElementById('key').textContent =
      'Last key: ' + JSON.stringify(event.key) + ' / ' + event.code +
      ' | Ctrl ' + event.ctrlKey + ' Alt ' + event.altKey + ' Shift ' + event.shiftKey;
  });
  window.labReady = true;
  if (window.ipc) window.ipc.postMessage(window.labScriptAtStart ? 'ready' : 'failed');
</script>
