[package]
name = "browser-servo-lab"
version = "0.1.0"
edition = "2024"
publish = false

# Keep Servo's native toolchain and dependency graph out of ordinary browser builds.
[workspace]

[dependencies]
browser-engine = { path = "../../crates/engine" }
servo = "=0.5.0"
# Servo 0.5's release lockfile uses 0.8.1. Later patches add Destination::Text,
# which breaks servo-net's exhaustive match. Remove only when upgrading Servo.
content-security-policy = "=0.8.1"
tao = "=0.35.3"
wry = "=0.55.0"
url = "2"
euclid = "0.22"
dpi = "0.1"
raw-window-handle = "0.6"
surfman = "=0.13.0"
rustls = { version = "0.23", features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[patch.crates-io]
servo-paint-api = { path = "vendor/servo-paint-api" }

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
lto = false
codegen-units = 16
