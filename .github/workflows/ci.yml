name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, docs, tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: rustdoc
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: --document-private-items -D warnings

      - name: tests
        run: cargo test --workspace --locked

      # The injected page scripts (bridge, hints, Servo's message queue) have Node tests.
      - name: page script tests
        run: node --test crates/desktop/tests/bridge-hints.cjs crates/desktop/tests/scroll-hints.cjs crates/desktop/tests/servo-bridge-queue.cjs

  servo:
    name: clippy, docs (with Servo)
    runs-on: windows-latest
    # Servo is large: a cold build takes most of an hour.
    timeout-minutes: 180
    env:
      # Servo's build generates bindings with the runner image's libclang.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: servo
          # Pull requests reuse main's cache instead of each saving their own copy.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: clippy
        run: cargo clippy -p browser --features servo-engine --all-targets --locked -- -D warnings

      - name: rustdoc
        run: cargo doc -p browser --features servo-engine --no-deps --locked
        env:
          RUSTDOCFLAGS: --document-private-items -D warnings
